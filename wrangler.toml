name = "vishalk"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

# Git builds read build env from this file (dashboard vars alone are not enough
# when wrangler.toml is present — log shows "Build environment variables: (none found)").
# Do not put RESEND_* / email secrets here — use Pages encrypted secrets.
[vars]
SKIP_DEPENDENCY_INSTALL = "true"
BUN_VERSION = "1.3.14"
VITE_HIRE_SIGNAL = "true"
VITE_GOOGLE_ANALYTICS_ID = "G-06C301CH3G"
