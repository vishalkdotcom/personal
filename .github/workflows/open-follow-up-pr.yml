# Tries to open a PR to main for this head. No-ops if one exists or if the
# repo disallows Actions from creating pull requests (Settings → Actions →
# Workflow permissions → Allow GitHub Actions to create and approve pull requests).
name: Open follow-up PR

on:
  push:
    branches:
      - vishalk/allow-crawlers-ci-7008
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create pull request if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$HEAD" --base main --json number,url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "PR already exists: $existing"
            exit 0
          fi
          set +e
          gh pr create --base main --head "$HEAD" --title "Skip Allow AI crawlers CI when the Cloudflare token is missing" --body "Follow-up to #30.

          Quality CI skips Allow AI crawlers when the Cloudflare token is missing, runs Quality on vishalk/**, and verifies the agent origin after build. Homepage title is Vishal Kumar; unknown paths return markdown 404s unless Accept prefers HTML; head rel=me and Person + Organization + WebSite JSON-LD use vishalk.com. App Shell visuals are unchanged.

          Preview: https://9259885b.vishalk.pages.dev

          After merge: bun scripts/verify-agent-readiness.mjs https://vishalk.com" 2> /tmp/pr-create.err
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          cat /tmp/pr-create.err
          if grep -q "not permitted to create or approve pull requests" /tmp/pr-create.err; then
            echo "::warning::Enable Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests, then re-run this workflow. Or open https://github.com/vishalkdotcom/personal/compare/main...vishalk/allow-crawlers-ci-7008?expand=1"
            exit 0
          fi
          exit "$status"
