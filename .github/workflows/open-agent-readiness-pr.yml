# Branch-only: this cloud agent can push but cannot open PRs (GitHub App
# has no pull-requests permission; Cursor also gates ManagePullRequest on
# user approval). ubuntu-latest's GITHUB_TOKEN can, when the repo allows
# Actions to create PRs. Safe no-op once the PR exists. Only runs on this
# feature branch — inert after merge.
name: Open agent-readiness PR

on:
  push:
    branches:
      - cursor/agent-readiness-2a91
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create pull request if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head cursor/agent-readiness-2a91 --base main --json number,url --jq '.[0].url // empty')"
          if [ -n "${existing}" ]; then
            echo "PR already open: ${existing}"
            exit 0
          fi
          if gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head cursor/agent-readiness-2a91 \
            --title "Agent-ready origin: 404s, crawler HTML, markdown, JSON-LD, and AI crawler allowlist" \
            --body-file .github/pull-request-agent-readiness.md; then
            exit 0
          fi
          echo "::error::Could not open the pull request. If the log says Actions is not permitted to create PRs, enable that in repo Settings → Actions → General, or open https://github.com/vishalkdotcom/personal/compare/main...cursor/agent-readiness-2a91?expand=1"
          exit 1
