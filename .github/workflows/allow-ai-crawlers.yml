# Optional: apply vishalk.com zone allowlist for AI crawlers.
# No-ops without CLOUDFLARE_API_TOKEN so Quality is unaffected.
name: Allow AI crawlers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/agent-readiness-2a91

permissions:
  contents: read

jobs:
  allow:
    runs-on: ubuntu-latest
    # Production env secrets (Cloudflare GitHub app) are not visible on repo-level jobs.
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Apply zone allowlist when a token is present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ALLOW_AI_CRAWLERS_OPTIONAL: "1"
        run: bun scripts/allow-ai-crawlers.mjs
