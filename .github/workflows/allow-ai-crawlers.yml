# Apply vishalk.com zone allowlist for AI crawlers.
# Uses repository secrets (not GitHub environment secrets). Cloudflare Pages
# Production/Preview environments can define an empty CLOUDFLARE_API_TOKEN that
# masks a repo secret of the same name.
# Missing token: skip (does not fail CI). Token present: apply or fail.
name: Allow AI crawlers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  allow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Apply zone allowlist when a token is present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ALLOW_AI_CRAWLERS_OPTIONAL: "1"
        run: bun scripts/allow-ai-crawlers.mjs
