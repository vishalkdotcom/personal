# Apply vishalk.com zone allowlist for AI crawlers, or verify live apex
# when CLOUDFLARE_API_TOKEN is missing.
# Uses repository secrets (not GitHub environment secrets). Cloudflare Pages
# Production/Preview environments can define an empty CLOUDFLARE_API_TOKEN that
# masks a repo secret of the same name.
# On main, a missing token runs `verify-agent-readiness.mjs` against the apex
# (fails if crawlers/origin regress). On other branches it no-ops so Quality
# stays green without hitting production.
name: Allow AI crawlers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  allow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Apply zone allowlist or verify live apex
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ALLOW_AI_CRAWLERS_OPTIONAL: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
        run: bun scripts/allow-ai-crawlers.mjs
